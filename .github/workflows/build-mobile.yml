name: build-mobile

# Build APK release (signed) untuk Yuika Mobile.
# Trigger manual dari tab Actions (Run workflow) — atau via API/gh.
# versionCode otomatis = run number, jadi APK baru selalu bisa
# di-install di atas versi lama tanpa uninstall.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache distribusi gradle + dependencies antar-run (runner flaky
      # saat download services.gradle.org / maven central → pola 504).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Set versionCode = run number
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
            console.log('versionCode =', a.expo.android.versionCode);
          "

      - name: Cache Gradle distribution zip
        uses: actions/cache@v4
        with:
          path: ~/gradle-9.4.1-bin.zip
          key: gradle-dist-9.4.1

      # Unduh distribusi via curl (retry keras) — wrapper lalu memakai zip
      # lokal via distributionUrl file://, tidak pernah menyentuh jaringan.
      - name: Download Gradle 9.4.1
        run: |
          ZIP="$HOME/gradle-9.4.1-bin.zip"
          if [ ! -s "$ZIP" ]; then
            curl -fL --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 -o "$ZIP" \
              https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          fi
          ls -la "$ZIP"

      - name: Prebuild android
        run: npx expo prebuild -p android --no-install

      - name: Point wrapper at local distribution
        run: |
          sed -i "s|^distributionUrl=.*|distributionUrl=file\://$HOME/gradle-9.4.1-bin.zip|" \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # Runner GitHub kerap kena 504 transien saat mengunduh dependency
          # Maven (kotlin-compiler dsb.) — retry; Gradle melanjutkan dari cache.
          for i in 1 2 3; do
            echo "gradle attempt $i"
            ./gradlew assembleRelease --no-daemon && exit 0
            sleep 30
          done
          exit 1

      - name: Verify signed
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk | head -3

      - name: Rename artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "yuika-mobile-v0.1.0-${GITHUB_RUN_NUMBER}.apk"
          ls -la yuika-mobile-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yuika-mobile-apk
          path: yuika-mobile-*.apk
          retention-days: 30
          if-no-files-found: error
